services:
  cj:
    build: .
    container_name: cj-brain
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      CJ_HOST_IP: ${CJ_HOST_IP:?set CJ_HOST_IP to this machine's LAN address, e.g. 192.168.1.20}
      CJ_TIMEZONE: ${CJ_TIMEZONE:-Asia/Kolkata}
    volumes:
      - cj-data:/data

volumes:
  cj-data:
