name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cj-mac:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cj-mac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cj-mac/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
