<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>CJ Female Voices</title>
<style>
:root { --bg:#f5f7f9; --surface:#fff; --ink:#15202b; --muted:#566573; --line:#d9e0e7; --accent:#1d5fa8; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f151b; --surface:#161e26; --ink:#e4eaf0; --muted:#9aa8b5; --line:#2a3541; --accent:#7fb2ea; } }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; padding:24px 16px 48px; }
main { max-width:760px; margin:0 auto; }
h1 { margin:0 0 4px; font-size:24px; }
.lines { color:var(--muted); font-size:14px; } .lines b { color:var(--ink); }
section { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin:10px 0; }
h3 { margin:0; font-size:15px; } code { color:var(--accent); font-size:12px; overflow-wrap:anywhere; }
.clip { display:grid; grid-template-columns:72px minmax(0,1fr); align-items:center; gap:4px 10px; margin:6px 0; }
.clip small { grid-column:2; color:var(--muted); font-size:12px; } audio { width:100%; height:36px; }
</style></head><body><main>
<h1>Pick CJ's voice</h1>
<p class="lines">Microsoft female voices on your Azure key. Each reads the same lines.<br><b>English:</b> EN<br><b>Hinglish:</b> HG<br><b>Hindi:</b> HI</p>

</main></body></html>
